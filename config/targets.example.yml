schema_version: 1
targets:
  - name: staging-web
    url: https://staging.example.org/
    allow_hosts:
      - staging.example.org
      - "*.staging.example.org"
    identities:
      - anonymous
      - user
      - admin
    limits:
      max_pages: 25
      request_budget: 250
      timeout_seconds: 10
    browser:
      settle_ms: 750
    # Optional family inputs. Absence is reported as SKIPPED with a reason.
    openapi: contracts/openapi.yml
    graphql_schema: contracts/schema.graphql
    container_image: null
    iac_globs:
      - infra/**/*.tf
      - deploy/**/*.yaml
