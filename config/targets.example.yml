schema_version: 1
targets:
  - name: example-web
    url: https://example.test/
    allow_hosts:
      - example.test
    identities:
      - anonymous
      - user
      - admin
    technologies:
      - web
    # Any listed family must RAN for publication to pass. Add optional families
    # here when their inputs are mandatory for the real target.
    required_families:
      - browser-discovery
      - runtime-verification
      - web-hardening
    minimum_coverage_ratio: 1.0
    limits:
      max_pages: 25
      request_budget: 250
      timeout_seconds: 10
    browser:
      settle_ms: 750
    # Optional family inputs. Missing values become explicit SKIPPED states.
    openapi: null
    graphql_schema: null
    container_image: null
    iac_globs:
      - infra/**/*.tf
    # Set source_root only when local source for THIS target is available. The
    # technology resolver never treats the HALO auditor repository as target source.
    source_root: null
