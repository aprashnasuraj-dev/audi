schema_version: 1
targets:
  - name: example-live-web
    url: https://app.example.test/

    # Seed authorization is exact. Do not convert this to a wildcard just to
    # increase coverage. Navigation-derived authenticated flows are governed by
    # authenticated_flow_suffixes and the scope-transition evidence path.
    allow_hosts:
      - app.example.test
    authenticated_flow_suffixes:
      - example.test
    deny_hosts:
      - blocked.example.test

    live_target: true
    scope_snapshot: "2026-09-14"
    scope_max_age_days: 60
    scope_note: "Replace with the current written authorization reference/boundary before a live run."

    identities:
      - anonymous
      - example-user

    # required: missing authenticated session blocks the run.
    # optional: use authenticated session if available, otherwise run the exact
    # public seed surface anonymously and report the coverage limitation.
    # anonymous-only: intentionally disable authenticated coverage.
    authentication_mode: optional

    technologies:
      - web

    # In optional mode, only capabilities that can always execute belong here.
    # runtime-verification will run automatically when a verified authenticated
    # identity is available; otherwise it is explicitly SKIPPED, not faked.
    required_families:
      - browser-discovery
      - web-hardening
    minimum_coverage_ratio: 1.0

    limits:
      max_pages: 25
      request_budget: 250
      timeout_seconds: 10
      max_requests_per_second: 2
      stop_on_429: true

    browser:
      settle_ms: 750
      allow_third_party_resources: true

    # Optional inputs. Add a family to required_families when the corresponding
    # input is mandatory for this target and assurance claim.
    openapi: null
    graphql_schema: null
    container_image: null
    iac_globs: []

    # Set this only when local source for THIS target is intentionally available.
    # HALO does not infer target technology from the auditor repository itself.
    source_root: null

    # Optional fingerprints for conservative known-issue/novelty classification.
    known_issues: []
