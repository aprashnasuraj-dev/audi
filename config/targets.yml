schema_version: 1
targets:
  - name: mock-local
    url: http://127.0.0.1:8765/
    allow_hosts:
      - 127.0.0.1
    authenticated_flow_hosts:
      - localhost
    deny_hosts:
      - blocked.invalid
      - "*.blocked.invalid"
    identities:
      - anonymous
      - mock-user
      - mock-admin
    technologies:
      - web
    required_families:
      - browser-discovery
      - runtime-verification
      - web-hardening
    minimum_coverage_ratio: 1.0
    limits:
      max_pages: 10
      request_budget: 120
      timeout_seconds: 5
      max_requests_per_second: 20
      max_retry_after_seconds: 5
      stop_on_429: true
    browser:
      settle_ms: 250
      allow_third_party_resources: false
    openapi: null
    graphql_schema: null
    container_image: null
    iac_globs:
      - infra/**/*.tf

  # Authorized program seed targets. Exact hosts are permanent seeds. A sibling
  # subdomain is never statically allowed: it can become FLOW_ALLOWED only after
  # a verified authenticated top-level navigation from an already-authorized page.
  - name: web-app
    url: https://app.web.com/
    live_target: true
    scope_snapshot: "2026-09-14"
    scope_max_age_days: 60
    allow_hosts:
      - app.web.com
    authenticated_flow_suffixes:
      - web.com
    deny_hosts:
      - register.com
      - "*.register.com"
      - app.gator.com
    identities:
      - anonymous
      - web-user
    require_authenticated_identity: true
    technologies:
      - web
    required_families:
      - browser-discovery
      - runtime-verification
      - web-hardening
    minimum_coverage_ratio: 1.0
    scope_note: "Exact app.web.com is a seed. Arbitrary *.web.com enumeration is out of scope; only verified authenticated browser navigation may grant an exact sibling host for that run."
    limits:
      max_pages: 35
      request_budget: 350
      timeout_seconds: 10
      max_requests_per_second: 2
      max_retry_after_seconds: 30
      stop_on_429: true
    browser:
      settle_ms: 900
      allow_third_party_resources: true
    openapi: null
    graphql_schema: null
    container_image: null
    iac_globs: []
    source_root: null

