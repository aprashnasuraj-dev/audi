schema_version: 1
targets:
  - name: mock-local
    url: http://127.0.0.1:8765/
    allow_hosts:
      - 127.0.0.1
    identities:
      - anonymous
      - mock-user
      - mock-admin
    technologies:
      - web
    required_families:
      - browser-discovery
      - runtime-verification
      - web-hardening
    minimum_coverage_ratio: 1.0
    limits:
      max_pages: 10
      request_budget: 100
      timeout_seconds: 5
    browser:
      settle_ms: 250
    openapi: null
    graphql_schema: null
    container_image: null
    iac_globs:
      - infra/**/*.tf

  # Authorized program seed targets. Keep allow_hosts exact: wildcard families are
  # explicitly out of scope. Authenticated subdomain flows require a separate,
  # navigation-derived scope mechanism before they may be followed automatically.
  - name: web-app
    url: https://app.web.com/
    allow_hosts:
      - app.web.com
    identities:
      - anonymous
    technologies:
      - web
    required_families:
      - browser-discovery
      - runtime-verification
      - web-hardening
    minimum_coverage_ratio: 1.0
    scope_snapshot: "2026-09-14"
    scope_note: "Exact app.web.com seed is in scope; arbitrary *.web.com enumeration is out of scope. Authenticated subdomain flows may be followed only when navigation provenance is captured by a future scope-transition gate."
    limits:
      max_pages: 25
      request_budget: 250
      timeout_seconds: 10
    browser:
      settle_ms: 750
    openapi: null
    graphql_schema: null
    container_image: null
    iac_globs: []
    source_root: null

