name: Minly Adaptive Audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit mode
        required: true
        default: blueprint
        type: choice
        options:
          - blueprint
          - public-map
          - offline-toolchain
      confirm_current_minly_scope:
        description: I confirmed Minly VDP scope still includes https://minly.com/ today
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: minly-adaptive-audit-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  policy-and-hypotheses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install policy dependencies
        run: |
          python -m pip install -U pip
          python -m pip install 'PyYAML==6.0.3'

      - name: Enforce Minly VDP audit policy
        run: |
          mkdir -p artifacts/minly-adaptive
          python scripts/minly_policy_gate.py --json | tee artifacts/minly-adaptive/policy-gate.json

      - name: Generate latent-risk hypothesis matrix
        run: python scripts/minly_hypothesis_matrix.py --output artifacts/minly-adaptive

      - name: Validate hypothesis/report separation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/minly-adaptive/hypothesis-matrix.json').read_text())
          assert len(data) >= 15
          assert all(item['status'] == 'hypothesis' for item in data)
          assert all(item['reportable_now'] is False for item in data)
          print(f'hypothesis separation gate: PASS ({len(data)} unconfirmed research hypotheses)')
          PY

      - name: Upload policy and hypothesis bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minly-adaptive-blueprint-${{ github.run_id }}
          path: artifacts/minly-adaptive/
          if-no-files-found: error
          retention-days: 30

  public-map:
    if: ${{ inputs.mode == 'public-map' }}
    needs: policy-and-hypotheses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require explicit live-scope confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirm_current_minly_scope }}" != "true" ]; then
            echo 'Public mapping blocked: current Minly VDP scope must be manually confirmed.'
            exit 2
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal live-safe dependencies
        run: |
          python -m pip install -U pip
          python -m pip install 'httpx>=0.27,<1' 'PyYAML==6.0.3'

      - name: Re-run policy gate before network traffic
        run: python scripts/minly_policy_gate.py

      - name: Low-volume exact-host public mapping
        run: |
          python scripts/minly_public_mapper.py \
            --max-pages 12 \
            --delay-seconds 2.6 \
            --output artifacts/minly-adaptive/public-map.json

      - name: Validate live-map safety properties
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/minly-adaptive/public-map.json').read_text())
          assert data['scope'] == 'https://minly.com/'
          assert data['exact_host'] == 'minly.com'
          assert data['state_mutation'] is False
          assert data['cross_host_redirects_followed'] is False
          assert data['request_count'] <= 12
          assert data['delay_seconds'] >= 2.5
          assert all(page['method'] == 'GET' for page in data['pages'])
          print('public-map safety gate: PASS')
          PY

      - name: Upload public mapping evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minly-public-map-${{ github.run_id }}
          path: artifacts/minly-adaptive/public-map.json
          if-no-files-found: error
          retention-days: 30

  offline-toolchain:
    if: ${{ inputs.mode == 'offline-toolchain' }}
    needs: policy-and-hypotheses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install advanced offline/manual analysis tools
        run: |
          python -m pip install -U pip
          python -m pip install \
            'semgrep==1.177.0' \
            'bandit==1.9.4' \
            'mitmproxy==12.2.2' \
            'pip-audit==2.10.1' \
            'PyYAML==6.0.3'
          bash scripts/install-trivy.sh
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Inventory and classify tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/minly-adaptive
          {
            semgrep --version
            bandit --version
            mitmdump --version | head -n 1
            pip-audit --version
            "${HOME}/.local/bin/trivy" --version | head -n 1
          } | tee artifacts/minly-adaptive/tool-versions.txt
          cp programs/minly-vdp/advanced-tool-versions.yml artifacts/minly-adaptive/

      - name: Enforce disabled-by-policy tool list
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path('programs/minly-vdp/advanced-tool-versions.yml').read_text())
          disabled = set(data.get('policy_disabled') or [])
          expected = {
              'nuclei_bulk_templates',
              'ffuf',
              'gobuster',
              'dirsearch',
              'zap_active_scan',
              'brute_force_wordlists',
              'broad_graphql_query_generation',
          }
          assert expected <= disabled, (expected - disabled)
          print('disabled-by-policy tool gate: PASS')
          PY

      - name: Upload advanced toolchain proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minly-offline-toolchain-${{ github.run_id }}
          path: artifacts/minly-adaptive/
          if-no-files-found: error
          retention-days: 30
