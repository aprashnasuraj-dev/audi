name: Minly VDP Final Heavy Audit

on:
  workflow_dispatch:
    inputs:
      confirm_current_scope:
        description: I re-checked Minly VDP scope and confirm minly.com + official Android/iOS apps are currently authorized
        required: true
        default: false
        type: boolean
      run_web:
        description: Run exact-host Minly website audit families
        required: true
        default: true
        type: boolean
      run_android:
        description: Run offline Android APK families using configured private artifact URL/SHA secrets
        required: true
        default: false
        type: boolean
      run_ios:
        description: Run offline iOS IPA families using configured private artifact URL/SHA secrets
        required: true
        default: false
        type: boolean
      max_pages:
        description: Maximum same-origin pages for the low-rate browser mapper
        required: true
        default: '12'
        type: choice
        options: ['6', '12', '20']
      request_budget:
        description: Hard same-origin request budget for browser mapping
        required: true
        default: '80'
        type: choice
        options: ['40', '80', '120']
      delay_ms:
        description: Minimum delay between mapper requests
        required: true
        default: '1200'
        type: choice
        options: ['1200', '2000', '3000']
      ios_expected_bundle_id:
        description: Optional expected iOS CFBundleIdentifier for the researcher-supplied IPA
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: minly-vdp-final-heavy-audit
  cancel-in-progress: false

jobs:
  preflight:
    name: Zero-traffic final-runner readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Confirm current scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_current_scope }}" != "true" ]; then
            echo 'Blocked: current Minly scope confirmation is required.'
            exit 2
          fi
      - name: Validate final runner, target configuration, and report compiler
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'PyYAML==6.0.3'
          python -m py_compile \
            programs/minly-vdp/final_audit_runner.py \
            programs/minly-vdp/final_report_maker.py \
            programs/minly-vdp/mobile_static_audit.py \
            programs/minly-vdp/minly_passive_map.py
          python - <<'PY'
          from pathlib import Path
          import json, yaml
          root=Path('programs/minly-vdp')
          scope=yaml.safe_load((root/'scope.yml').read_text())
          assert scope['in_scope']['website'][0]['exact_hosts'] == ['minly.com']
          assert scope['in_scope']['android'][0]['package'] == 'com.minly.users'
          assert scope['in_scope']['ios'][0]['app_store_id'] == '1528802350'
          target=yaml.safe_load((root/'halo-targets.yml').read_text())['targets'][0]
          assert target['url'] == 'https://minly.com/'
          assert target['allow_hosts'] == ['minly.com']
          assert '*.minly.com' in target['deny_hosts']
          assert target['limits']['max_requests_per_second'] <= 1
          schema=json.loads((root/'manual-findings.schema.json').read_text())
          assert schema['properties']['findings']['type'] == 'array'
          print('final heavy-audit zero-traffic readiness: PASS')
          PY

  web:
    name: Website exact-scope + offline client families
    if: ${{ inputs.run_web }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MINLY_USER_STORAGE_STATE_B64: ${{ secrets.MINLY_USER_STORAGE_STATE_B64 }}
      HALO_MINLY_USER_AUTH_CHECK_URL: ${{ secrets.MINLY_USER_AUTH_CHECK_URL }}
      HALO_MINLY_USER_AUTH_CHECK_CONTAINS: ${{ secrets.MINLY_USER_AUTH_CHECK_CONTAINS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install web audit toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -e '.[all]'
          python -m pip install 'PyYAML==6.0.3' 'semgrep<2' 'detect-secrets<2'
          python -m playwright install --with-deps chromium
          semgrep --validate --config programs/minly-vdp/semgrep/minly-client.yml
      - name: Materialize ephemeral researcher-controlled Minly session
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MINLY_USER_STORAGE_STATE_B64:-}" ]; then
            auth_dir="${RUNNER_TEMP}/minly-auth"
            mkdir -p "$auth_dir"
            chmod 700 "$auth_dir"
            path="$auth_dir/storage-state.json"
            printf '%s' "$MINLY_USER_STORAGE_STATE_B64" | base64 --decode > "$path"
            chmod 600 "$path"
            python -m json.tool "$path" >/dev/null
            echo "HALO_MINLY_USER_STORAGE_STATE=$path" >> "$GITHUB_ENV"
            echo 'Authenticated researcher storage state materialized ephemerally.'
          else
            echo 'No Minly storage state supplied: website phase will remain anonymous/public-only.'
          fi
      - name: Run final website audit families
        shell: bash
        run: |
          set -euo pipefail
          python programs/minly-vdp/final_audit_runner.py \
            --phase web \
            --output artifacts/minly-final \
            --max-pages "${{ inputs.max_pages }}" \
            --request-budget "${{ inputs.request_budget }}" \
            --delay-ms "${{ inputs.delay_ms }}"
      - name: Website artifact sanitation gate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e artifacts/minly-final/web/passive/_temp_js
          test ! -e artifacts/minly-final/web/passive/semgrep-raw.json
          test ! -e artifacts/minly-final/web/passive/detect-secrets-raw.json
          python - <<'PY'
          from pathlib import Path
          forbidden=['authorization:', 'set-cookie:', 'bearer ', 'cookie:']
          for p in Path('artifacts/minly-final/web').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.json','.md','.txt','.html'}: continue
              t=p.read_text(errors='ignore').lower()
              bad=[x for x in forbidden if x in t]
              if bad: raise SystemExit(f'possible secret/header material remained in {p}: {bad}')
          print('website artifact sanitation: PASS')
          PY
      - name: Remove ephemeral session material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/minly-auth"
      - name: Upload website family evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minly-final-web-${{ github.run_id }}
          path: artifacts/minly-final/web/
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android offline static families
    if: ${{ inputs.run_android }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MOBILE_ARTIFACT_URL: ${{ secrets.MINLY_ANDROID_APK_URL }}
      MOBILE_ARTIFACT_SHA256: ${{ secrets.MINLY_ANDROID_APK_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@7a445ee88d4e23b52c33a2039a230077c4367a0b # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android audit toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool unzip file binutils
          python -m pip install -U pip
          python -m pip install 'PyYAML==6.0.3' 'androguard<5' 'mobsfscan<1' 'semgrep<2' 'detect-secrets<2' 'lief<1'
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
            echo "$bt" >> "$GITHUB_PATH"
          fi
          if ! command -v jadx >/dev/null 2>&1; then
            echo 'JADX is optional in this runner; family will be explicitly SKIPPED if unavailable.'
          fi
      - name: Download and SHA-256 verify researcher-supplied APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MOBILE_ARTIFACT_URL:-}" || { echo 'Missing MINLY_ANDROID_APK_URL secret'; exit 2; }
          test -n "${MOBILE_ARTIFACT_SHA256:-}" || { echo 'Missing MINLY_ANDROID_APK_SHA256 secret'; exit 2; }
          mkdir -p "${RUNNER_TEMP}/minly-android"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.parse, urllib.request
          url=os.environ['MOBILE_ARTIFACT_URL']; expected=os.environ['MOBILE_ARTIFACT_SHA256'].strip().lower()
          p=urllib.parse.urlsplit(url)
          if p.scheme!='https' or p.username or p.password: raise SystemExit('APK URL must be HTTPS without embedded credentials')
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'minly-android'/'app.apk'
          req=urllib.request.Request(url, headers={'User-Agent':'Minly-VDP-final-offline-audit/1.0'})
          with urllib.request.urlopen(req, timeout=120) as r, dest.open('wb') as f:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  f.write(chunk)
                  if f.tell()>600*1024*1024: raise SystemExit('APK exceeds 600 MiB safety limit')
          actual=hashlib.sha256(dest.read_bytes()).hexdigest()
          if actual!=expected: dest.unlink(missing_ok=True); raise SystemExit(f'APK SHA mismatch: {actual}')
          print('APK SHA-256 verification: PASS')
          PY
      - name: Run Android static families
        shell: bash
        run: |
          set -euo pipefail
          python programs/minly-vdp/final_audit_runner.py \
            --phase android \
            --artifact "${RUNNER_TEMP}/minly-android/app.apk" \
            --output artifacts/minly-final
          python programs/minly-vdp/mobile_artifact_inspect.py \
            --platform android \
            --artifact "${RUNNER_TEMP}/minly-android/app.apk" \
            --output artifacts/minly-final/android/artifact-inspection.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/minly-final/android/summary.json').read_text())
          observed=data.get('observed_package')
          if observed and observed!='com.minly.users': raise SystemExit(f'wrong Android package: {observed}')
          inspect=json.loads(Path('artifacts/minly-final/android/artifact-inspection.json').read_text())
          package=(inspect.get('identity') or {}).get('package')
          if package and package!='com.minly.users': raise SystemExit(f'wrong Android package from inspector: {package}')
          print('Android identity gate: PASS')
          PY
      - name: Remove APK and decoded proprietary content
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/minly-android"
          rm -rf artifacts/minly-final/android/decoded artifacts/minly-final/android/jadx
      - name: Upload Android family evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minly-final-android-${{ github.run_id }}
          path: artifacts/minly-final/android/
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS offline static families
    if: ${{ inputs.run_ios }}
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 75
    env:
      MOBILE_ARTIFACT_URL: ${{ secrets.MINLY_IOS_IPA_URL }}
      MOBILE_ARTIFACT_SHA256: ${{ secrets.MINLY_IOS_IPA_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install iOS audit toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install 'PyYAML==6.0.3' 'semgrep<2' 'detect-secrets<2' 'lief<1'
          xcrun --find otool
          xcrun --find nm
          command -v codesign
          command -v strings
      - name: Download and SHA-256 verify researcher-supplied IPA
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MOBILE_ARTIFACT_URL:-}" || { echo 'Missing MINLY_IOS_IPA_URL secret'; exit 2; }
          test -n "${MOBILE_ARTIFACT_SHA256:-}" || { echo 'Missing MINLY_IOS_IPA_SHA256 secret'; exit 2; }
          mkdir -p "${RUNNER_TEMP}/minly-ios"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.parse, urllib.request
          url=os.environ['MOBILE_ARTIFACT_URL']; expected=os.environ['MOBILE_ARTIFACT_SHA256'].strip().lower()
          p=urllib.parse.urlsplit(url)
          if p.scheme!='https' or p.username or p.password: raise SystemExit('IPA URL must be HTTPS without embedded credentials')
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'minly-ios'/'app.ipa'
          req=urllib.request.Request(url, headers={'User-Agent':'Minly-VDP-final-offline-audit/1.0'})
          with urllib.request.urlopen(req, timeout=120) as r, dest.open('wb') as f:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  f.write(chunk)
                  if f.tell()>800*1024*1024: raise SystemExit('IPA exceeds 800 MiB safety limit')
          actual=hashlib.sha256(dest.read_bytes()).hexdigest()
          if actual!=expected: dest.unlink(missing_ok=True); raise SystemExit(f'IPA SHA mismatch: {actual}')
          print('IPA SHA-256 verification: PASS')
          PY
      - name: Run iOS static families
        shell: bash
        run: |
          set -euo pipefail
          args=(--phase ios --artifact "${RUNNER_TEMP}/minly-ios/app.ipa" --output artifacts/minly-final)
          if [ -n "${{ inputs.ios_expected_bundle_id }}" ]; then args+=(--expected-bundle-id "${{ inputs.ios_expected_bundle_id }}"); fi
          python programs/minly-vdp/final_audit_runner.py "${args[@]}"
          python programs/minly-vdp/mobile_artifact_inspect.py \
            --platform ios \
            --artifact "${RUNNER_TEMP}/minly-ios/app.ipa" \
            --output artifacts/minly-final/ios/artifact-inspection.json
      - name: Remove IPA and extracted proprietary content
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/minly-ios"
          rm -rf artifacts/minly-final/ios/extracted
          rm -f artifacts/minly-final/ios/binary-strings.txt
      - name: Upload iOS family evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minly-final-ios-${{ github.run_id }}
          path: artifacts/minly-final/ios/
          if-no-files-found: error
          retention-days: 30

  compile:
    name: Compile human-reviewed final report bundle
    if: ${{ always() && needs.preflight.result == 'success' }}
    needs: [preflight, web, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MINLY_MANUAL_FINDINGS_B64: ${{ secrets.MINLY_MANUAL_FINDINGS_B64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download successful audit-family artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: minly-final-*-${{ github.run_id }}
          path: artifacts/minly-final
          merge-multiple: true
      - name: Materialize optional human-reviewed findings
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MINLY_MANUAL_FINDINGS_B64:-}" ]; then
            path="${RUNNER_TEMP}/manual-findings.json"
            printf '%s' "$MINLY_MANUAL_FINDINGS_B64" | base64 --decode > "$path"
            python -m json.tool "$path" >/dev/null
            echo "MINLY_MANUAL_FINDINGS_PATH=$path" >> "$GITHUB_ENV"
          fi
      - name: Compile final evidence and submission reports
        shell: bash
        run: |
          set -euo pipefail
          args=(--phase compile --output artifacts/minly-final)
          if [ -n "${MINLY_MANUAL_FINDINGS_PATH:-}" ]; then args+=(--manual-findings "$MINLY_MANUAL_FINDINGS_PATH"); fi
          python programs/minly-vdp/final_audit_runner.py "${args[@]}"
      - name: Build PDF copy of compiled human-review report
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'weasyprint<70'
          weasyprint \
            artifacts/minly-final/final-report/compiled-final-report.html \
            artifacts/minly-final/final-report/compiled-final-report.pdf
      - name: Final report integrity gate
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/minly-final/final-report/compiled-final-report.json
          test -s artifacts/minly-final/final-report/compiled-final-report.md
          test -s artifacts/minly-final/final-report/compiled-final-report.html
          test -s artifacts/minly-final/final-report/compiled-final-report.pdf
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/minly-final/final-report/compiled-final-report.json')
          data=json.loads(p.read_text())
          policy=data['policy']
          assert policy['do_not_invent_findings'] is True
          assert policy['proof_required_for_claims'] is True
          assert policy['automated_candidates_are_unverified'] is True
          for f in data['accepted_manual_findings']:
              assert f['status'] in {'Verified','Partially verified','Unverified'}
              assert f['impact_attacker'].lower().startswith('as an attacker, i could')
          print('final report integrity: PASS')
          PY
      - name: Remove ephemeral manual findings source
        if: always()
        run: rm -f "${RUNNER_TEMP}/manual-findings.json"
      - name: Upload final heavy audit bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minly-final-heavy-audit-${{ github.run_id }}
          path: artifacts/minly-final/
          if-no-files-found: error
          retention-days: 30
