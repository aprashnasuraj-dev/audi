name: CI

on:
  push:
    branches: [main, feat/halo-clean-foundation]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/test_foundation.py tests/test_hypothesis_reporting.py tests/test_adapter_contract.py
      - run: python -m compileall -q src tests scripts

  mock-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[test,browser]'
      - run: python -m playwright install --with-deps chromium
      - name: Phase 2 acceptance gate
        run: python -m pytest tests/test_mock_pipeline.py
