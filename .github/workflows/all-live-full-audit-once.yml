name: One-shot All Live Full Audit

on:
  push:
    branches:
      - verify/all-live-full-audit

permissions:
  contents: read

concurrency:
  group: halo-all-live-full-audit-once
  cancel-in-progress: false

jobs:
  all-live-full-audit:
    name: All live targets full audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install HALO full dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[all]'

      - name: Repository integrity gates
        run: |
          python -m pytest -q
          python -m compileall -q src tests scripts

      - name: Inventory registered audit adapters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/all-live
          python - <<'PY'
          import json
          from pathlib import Path
          adapter_dir = Path('src/halo/adapters')
          adapters = sorted(p.name for p in adapter_dir.glob('*.py') if p.name not in {'__init__.py', 'base.py'})
          expected = {
              'browser_discovery.py',
              'web_hardening.py',
              'replay_runtime.py',
              'openapi_contract.py',
              'graphql_schema.py',
              'trivy_exec.py',
          }
          missing = sorted(expected - set(adapters))
          if missing:
              raise SystemExit(f'missing registered adapter modules: {missing}')
          payload = {'registered_adapter_modules': adapters, 'expected_present': sorted(expected)}
          Path('artifacts/all-live/tool-inventory.json').write_text(json.dumps(payload, indent=2))
          print(json.dumps(payload, indent=2))
          PY

      - name: Zero-traffic all-live preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preflight.py --live-only --json > artifacts/all-live/preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/all-live/preflight.json').read_text())
          assert data.get('ready') is True, data
          targets = data.get('targets') or []
          assert len(targets) == 4, f'expected 4 live targets, got {len(targets)}'
          for item in targets:
              assert item.get('ready') is True, item
              assert item.get('authentication_mode') == 'optional', item
              assert item.get('operational_identities') == ['anonymous'], item
          print('all-live preflight: READY for 4 public-surface targets')
          PY

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install and verify pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-trivy.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/trivy" --version | tee artifacts/all-live/trivy-version.txt

      - name: Run complete all-live audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run-audit.py \
            --live-only \
            --hypothesis \
            --output artifacts/all-live/report

      - name: Validate complete multi-target report
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/all-live/report"
          for f in report.json report.md report.html report.pdf findings.sarif sbom.cdx.json vex.openvex.json; do
            test -s "$root/$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/all-live/report')
          report = json.loads((root/'report.json').read_text())
          targets = report.get('targets') or []
          assert len(targets) == 4, f'expected 4 audited live targets, got {len(targets)}'
          summary = []
          for target in targets:
              name = target['target']
              coverage = {r['family']: r for r in target.get('coverage') or []}
              publication = target.get('publication') or {}
              assert publication.get('passed') is True, f'{name} publication failed: {publication}'
              assert coverage.get('browser-discovery', {}).get('status') == 'RAN', (name, coverage.get('browser-discovery'))
              assert coverage.get('web-hardening', {}).get('status') == 'RAN', (name, coverage.get('web-hardening'))
              assert coverage.get('reproduction-verification', {}).get('status') == 'RAN', (name, coverage.get('reproduction-verification'))
              runtime = coverage.get('runtime-verification', {})
              assert runtime.get('status') in {'RAN', 'SKIPPED'}, (name, runtime)
              summary.append({
                  'target': name,
                  'observations': len(target.get('observations') or []),
                  'canonical_issues': len(target.get('canonical_issues') or []),
                  'publication_passed': True,
                  'runtime_verification': runtime.get('status'),
                  'required_families': publication.get('required_families'),
                  'ran_required_families': publication.get('ran_required_families'),
              })
          (Path('artifacts/all-live')/'validation-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          sarif = json.loads((root/'findings.sarif').read_text())
          sbom = json.loads((root/'sbom.cdx.json').read_text())
          vex = json.loads((root/'vex.openvex.json').read_text())
          assert sarif.get('version') == '2.1.0'
          assert sbom.get('bomFormat') == 'CycloneDX'
          assert '@context' in vex
          print('multi-target bundle validation: PASS')
          PY

      - name: Upload complete all-live audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: halo-all-live-full-${{ github.run_id }}
          path: artifacts/all-live/
          if-no-files-found: error
          retention-days: 90
