name: Final Heavy Verification

on:
  push:
    branches:
      - verify/final-heavy-audit

permissions:
  contents: read

concurrency:
  group: halo-final-heavy-verification
  cancel-in-progress: false

jobs:
  full-suite:
    name: Full suite (${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[test]'
      - name: Full pytest suite
        run: python -m pytest -q
      - name: Compile all Python
        run: python -m compileall -q src tests scripts

  heavy-audit:
    name: Heavy seeded audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[all]'

      - name: Zero-traffic live readiness snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/final-heavy
          python scripts/preflight.py --live-only --json > artifacts/final-heavy/live-preflight.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/final-heavy/live-preflight.json')
          data = json.loads(p.read_text())
          print('live readiness:', 'READY' if data.get('ready') else 'BLOCKED (expected when runtime secrets are absent)')
          for item in data.get('targets', []):
              print(item.get('target'), 'READY' if item.get('ready') else 'BLOCKED')
          PY

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install pinned Trivy
        run: |
          bash scripts/install-trivy.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Verify pinned Trivy
        run: trivy --version

      - name: Start seeded mock target
        run: |
          echo 'HALO_MOCK_USER_TOKEN=user-token' >> "$GITHUB_ENV"
          echo 'HALO_MOCK_ADMIN_TOKEN=admin-token' >> "$GITHUB_ENV"
          nohup python scripts/serve-mock.py > /tmp/halo-mock.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/halo-mock.log
          exit 1

      - name: Full seeded audit with hypothesis and reproduction
        run: |
          python scripts/run-audit.py \
            --target mock-local \
            --hypothesis \
            --phase2-gate \
            --output artifacts/final-heavy/audit

      - name: Validate complete report bundle
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            report.json \
            report.md \
            report.html \
            report.pdf \
            findings.sarif \
            sbom.cdx.json \
            vex.openvex.json; do
            test -s "artifacts/final-heavy/audit/$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/final-heavy/audit')
          report = json.loads((root/'report.json').read_text())
          sarif = json.loads((root/'findings.sarif').read_text())
          sbom = json.loads((root/'sbom.cdx.json').read_text())
          vex = json.loads((root/'vex.openvex.json').read_text())
          assert report.get('targets'), 'report has no target results'
          target = report['targets'][0]
          coverage = target.get('coverage') or []
          assert any(r.get('family') == 'browser-discovery' and r.get('status') == 'RAN' for r in coverage)
          assert any(r.get('family') == 'runtime-verification' and r.get('status') == 'RAN' for r in coverage)
          assert any(r.get('family') == 'web-hardening' and r.get('status') == 'RAN' for r in coverage)
          assert any(r.get('family') == 'reproduction-verification' and r.get('status') == 'RAN' for r in coverage)
          assert sarif.get('version') == '2.1.0'
          assert sbom.get('bomFormat') == 'CycloneDX'
          assert '@context' in vex
          print('bundle validation: PASS')
          print('findings:', len(target.get('findings') or []))
          print('coverage records:', len(coverage))
          PY

      - name: Upload final verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: halo-final-heavy-${{ github.run_id }}
          path: artifacts/final-heavy/
          if-no-files-found: error
          retention-days: 90
