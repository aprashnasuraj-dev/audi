name: Full Audit

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target name from config/targets.yml (blank = all)
        required: false
        type: string
      hypothesis:
        description: Enable Phase 3 enrichment and reproduction verification
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HALO_USER_TOKEN: ${{ secrets.HALO_USER_TOKEN }}
      HALO_ADMIN_TOKEN: ${{ secrets.HALO_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[all]'
      - run: python -m playwright install --with-deps chromium

      - name: Install pinned Trivy
        run: |
          bash scripts/install-trivy.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Start seeded mock target when requested
        if: ${{ inputs.target == 'mock-local' || inputs.target == '' }}
        run: |
          echo 'HALO_MOCK_USER_TOKEN=user-token' >> "$GITHUB_ENV"
          echo 'HALO_MOCK_ADMIN_TOKEN=admin-token' >> "$GITHUB_ENV"
          nohup python scripts/serve-mock.py > /tmp/halo-mock.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/halo-mock.log
          exit 1

      - name: Run audit
        shell: bash
        run: |
          args=(--output artifacts/full)
          if [ "${{ inputs.hypothesis }}" = "true" ]; then args+=(--hypothesis); fi
          if [ -n "${{ inputs.target }}" ]; then args+=(--target "${{ inputs.target }}"); fi
          if [ "${{ inputs.target }}" = "mock-local" ]; then args+=(--phase2-gate); fi
          python scripts/run-audit.py "${args[@]}"

      - name: Upload combined report bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: halo-audit-${{ github.run_id }}
          path: artifacts/full/
          if-no-files-found: error
          retention-days: 90
