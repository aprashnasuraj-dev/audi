name: Full Audit

on:
  workflow_dispatch:
    inputs:
      target:
        description: Authorized target to audit
        required: true
        default: mock-local
        type: choice
        options:
          - mock-local
          - web-app
          - networksolutions
          - bluehost
          - hostgator
          - all-live
      confirm_authorized_scope:
        description: I confirm the selected live target(s) are currently authorized under the configured scope snapshot
        required: true
        default: false
        type: boolean
      hypothesis:
        description: Enable threat enrichment and reproduction verification
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  security-events: write

concurrency:
  group: halo-audit-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HALO_WEB_USER_STORAGE_STATE_B64: ${{ secrets.HALO_WEB_USER_STORAGE_STATE_B64 }}
      HALO_WEB_USER_AUTH_CHECK_URL: ${{ secrets.HALO_WEB_USER_AUTH_CHECK_URL }}
      HALO_WEB_USER_AUTH_CHECK_CONTAINS: ${{ secrets.HALO_WEB_USER_AUTH_CHECK_CONTAINS }}
      HALO_NETWORKSOLUTIONS_USER_STORAGE_STATE_B64: ${{ secrets.HALO_NETWORKSOLUTIONS_USER_STORAGE_STATE_B64 }}
      HALO_NETWORKSOLUTIONS_USER_AUTH_CHECK_URL: ${{ secrets.HALO_NETWORKSOLUTIONS_USER_AUTH_CHECK_URL }}
      HALO_NETWORKSOLUTIONS_USER_AUTH_CHECK_CONTAINS: ${{ secrets.HALO_NETWORKSOLUTIONS_USER_AUTH_CHECK_CONTAINS }}
      HALO_BLUEHOST_USER_STORAGE_STATE_B64: ${{ secrets.HALO_BLUEHOST_USER_STORAGE_STATE_B64 }}
      HALO_BLUEHOST_USER_AUTH_CHECK_URL: ${{ secrets.HALO_BLUEHOST_USER_AUTH_CHECK_URL }}
      HALO_BLUEHOST_USER_AUTH_CHECK_CONTAINS: ${{ secrets.HALO_BLUEHOST_USER_AUTH_CHECK_CONTAINS }}
      HALO_HOSTGATOR_USER_STORAGE_STATE_B64: ${{ secrets.HALO_HOSTGATOR_USER_STORAGE_STATE_B64 }}
      HALO_HOSTGATOR_USER_AUTH_CHECK_URL: ${{ secrets.HALO_HOSTGATOR_USER_AUTH_CHECK_URL }}
      HALO_HOSTGATOR_USER_AUTH_CHECK_CONTAINS: ${{ secrets.HALO_HOSTGATOR_USER_AUTH_CHECK_CONTAINS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Confirm live authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.target }}" != "mock-local" ] && [ "${{ inputs.confirm_authorized_scope }}" != "true" ]; then
            echo "Live audit blocked: confirm_authorized_scope must be true."
            exit 2
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[all]'

      - name: Prepare mock credentials
        if: ${{ inputs.target == 'mock-local' }}
        run: |
          echo 'HALO_MOCK_USER_TOKEN=user-token' >> "$GITHUB_ENV"
          echo 'HALO_MOCK_ADMIN_TOKEN=admin-token' >> "$GITHUB_ENV"

      - name: Materialize ephemeral live browser sessions
        if: ${{ inputs.target != 'mock-local' }}
        shell: bash
        run: |
          set -euo pipefail
          auth_dir="${RUNNER_TEMP}/halo-auth"
          mkdir -p "$auth_dir"
          chmod 700 "$auth_dir"

          materialize() {
            local source_var="$1" path_var="$2" filename="$3"
            local value="${!source_var:-}"
            if [ -z "$value" ]; then
              return 0
            fi
            local path="${auth_dir}/${filename}"
            printf '%s' "$value" | base64 --decode > "$path"
            chmod 600 "$path"
            echo "${path_var}=${path}" >> "$GITHUB_ENV"
          }

          case "${{ inputs.target }}" in
            web-app)
              materialize HALO_WEB_USER_STORAGE_STATE_B64 HALO_WEB_USER_STORAGE_STATE web-user.json ;;
            networksolutions)
              materialize HALO_NETWORKSOLUTIONS_USER_STORAGE_STATE_B64 HALO_NETWORKSOLUTIONS_USER_STORAGE_STATE networksolutions-user.json ;;
            bluehost)
              materialize HALO_BLUEHOST_USER_STORAGE_STATE_B64 HALO_BLUEHOST_USER_STORAGE_STATE bluehost-user.json ;;
            hostgator)
              materialize HALO_HOSTGATOR_USER_STORAGE_STATE_B64 HALO_HOSTGATOR_USER_STORAGE_STATE hostgator-user.json ;;
            all-live)
              materialize HALO_WEB_USER_STORAGE_STATE_B64 HALO_WEB_USER_STORAGE_STATE web-user.json
              materialize HALO_NETWORKSOLUTIONS_USER_STORAGE_STATE_B64 HALO_NETWORKSOLUTIONS_USER_STORAGE_STATE networksolutions-user.json
              materialize HALO_BLUEHOST_USER_STORAGE_STATE_B64 HALO_BLUEHOST_USER_STORAGE_STATE bluehost-user.json
              materialize HALO_HOSTGATOR_USER_STORAGE_STATE_B64 HALO_HOSTGATOR_USER_STORAGE_STATE hostgator-user.json ;;
          esac

      - name: Zero-traffic preflight
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.target }}" = "all-live" ]; then
            python scripts/preflight.py --live-only
          else
            python scripts/preflight.py --target "${{ inputs.target }}"
          fi

      - run: python -m playwright install --with-deps chromium

      - name: Install pinned Trivy
        run: |
          bash scripts/install-trivy.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Start seeded mock target
        if: ${{ inputs.target == 'mock-local' }}
        run: |
          nohup python scripts/serve-mock.py > /tmp/halo-mock.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/halo-mock.log
          exit 1

      - name: Run audit
        shell: bash
        run: |
          set -euo pipefail
          args=(--output artifacts/full)
          if [ "${{ inputs.hypothesis }}" = "true" ]; then args+=(--hypothesis); fi
          if [ "${{ inputs.target }}" = "all-live" ]; then
            args+=(--live-only)
          else
            args+=(--target "${{ inputs.target }}")
          fi
          if [ "${{ inputs.target }}" = "mock-local" ]; then args+=(--phase2-gate); fi
          python scripts/run-audit.py "${args[@]}"

      - name: Upload combined report bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: halo-audit-${{ github.run_id }}
          path: artifacts/full/
          if-no-files-found: error
          retention-days: 90
