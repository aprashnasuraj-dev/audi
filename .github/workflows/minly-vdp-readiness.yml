name: Minly VDP Blueprint Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - 'program/minly-*'
      - 'feat/minly-*'
      - main
    paths:
      - 'programs/minly-vdp/**'
      - '.github/workflows/minly-vdp-readiness.yml'
      - '.github/workflows/minly-vdp-mobile-audit.yml'

permissions:
  contents: read

jobs:
  validate-blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install 'PyYAML==6.0.3'

      - name: Validate exact program scope and guardrails
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path('programs/minly-vdp')
          required = [
              'README.md',
              'scope.yml',
              'ACCOUNT_SETUP.md',
              'WORKFLOW_MAP.md',
              'AUTHORIZATION_TEST_PLAN.md',
              'PHASE1_SESSION_CHECKLIST.md',
              'FINDING_ELIGIBILITY_GATE.md',
              'WEB_TEST_MATRIX.md',
              'MOBILE_TEST_MATRIX.md',
              'MOBILE_TOOLCHAIN.md',
              'mobile_artifact_inspect.py',
              'EVIDENCE_CHECKLIST.md',
              'SUBMISSION_TEMPLATE.md',
              'FINAL_REPORT_FORMAT.md',
              'WORKLOG_TEMPLATE.md',
              'CONFIDENTIALITY.md',
              'RESEARCH_PLAN.md',
              'SUBMISSION_SCORECARD.md',
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f'missing blueprint files: {missing}')

          scope = yaml.safe_load((root / 'scope.yml').read_text(encoding='utf-8'))
          assert scope['schema_version'] == 1
          assert scope['program'] == 'Minly VDP'

          website = scope['in_scope']['website']
          assert len(website) == 1
          assert website[0]['url'] == 'https://minly.com/'
          assert website[0]['exact_hosts'] == ['minly.com']
          assert all('*' not in host for host in website[0]['exact_hosts'])

          ios = scope['in_scope']['ios'][0]
          android = scope['in_scope']['android'][0]
          assert ios['app_store_id'] == '1528802350'
          assert android['package'] == 'com.minly.users'

          prohibited = set(scope['prohibited_actions'])
          for required_rule in {
              'denial_of_service',
              'distributed_denial_of_service',
              'social_engineering',
              'high_volume_automated_scanning',
              'public_disclosure_before_resolution',
          }:
              assert required_rule in prohibited

          assert scope['account_policy']['own_accounts_only'] is True
          assert scope['account_policy']['access_other_user_data'] == 'forbidden'
          assert scope['report_requirements']['manual_verification'] == 'required'
          assert scope['report_requirements']['clear_security_impact'] == 'required'

          account_setup = (root / 'ACCOUNT_SETUP.md').read_text(encoding='utf-8')
          auth_plan = (root / 'AUTHORIZATION_TEST_PLAN.md').read_text(encoding='utf-8')
          assert 'Account A' in account_setup and 'Account B' in account_setup
          assert 'Do not enumerate identifiers' in auth_plan
          assert 'researcher-controlled' in auth_plan

          print('Minly VDP blueprint: scope/guardrail/phase-one validation PASS')
          PY

      - name: Validate Android/iOS offline audit toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile programs/minly-vdp/mobile_artifact_inspect.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          wf_path = Path('.github/workflows/minly-vdp-mobile-audit.yml')
          assert wf_path.is_file(), 'missing Minly mobile audit workflow'
          text = wf_path.read_text(encoding='utf-8')
          workflow = yaml.safe_load(text)

          # Manual only: app artifact analysis must never auto-run against a live target.
          triggers = workflow.get(True) or workflow.get('on') or {}
          assert 'workflow_dispatch' in triggers
          assert 'push' not in triggers and 'schedule' not in triggers

          for phrase in [
              'com.minly.users',
              '1528802350',
              'MINLY_ANDROID_APK_URL',
              'MINLY_ANDROID_APK_SHA256',
              'MINLY_IOS_IPA_URL',
              'MINLY_IOS_IPA_SHA256',
              'androguard',
              'apktool',
              'semgrep',
              'detect-secrets',
              'lief',
              'trivy',
              'codesign',
              'otool',
              'manual_validation_required',
          ]:
              assert phrase in text, f'missing mobile toolchain requirement: {phrase}'

          guide = Path('programs/minly-vdp/MOBILE_TOOLCHAIN.md').read_text(encoding='utf-8')
          for phrase in [
              'candidate',
              'researcher-controlled',
              'Do not commit APK/IPA binaries',
              'not a report by itself',
              'App Store ID `1528802350`',
              'package `com.minly.users`',
          ]:
              assert phrase in guide, f'missing mobile methodology guardrail: {phrase}'

          print('Minly Android/iOS toolchain schema validation PASS')
          PY

      - name: Validate canonical final-report format
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('programs/minly-vdp')
          template = (root / 'SUBMISSION_TEMPLATE.md').read_text(encoding='utf-8')
          rules = (root / 'FINAL_REPORT_FORMAT.md').read_text(encoding='utf-8')
          lines = template.splitlines()

          required_headings = [
              '# Submission title',
              '# Target',
              '# Technical severity',
              '# VRT Category',
              '# URL / Location of vulnerability',
              '# Description',
              '## Summary',
              '## Vulnerability details',
              '## Steps to reproduce',
              '## Proof of concept',
              '## Impact',
              '## Suggested remediation',
              '# Attachments',
          ]
          positions = []
          for heading in required_headings:
              try:
                  pos = lines.index(heading)
              except ValueError:
                  raise AssertionError(f'missing canonical report heading: {heading}')
              positions.append(pos)
          assert positions == sorted(positions), 'canonical report headings are out of order'

          required_phrases = [
              'As an attacker, I could...',
              'Verification status',
              'Verified / Partially verified / Unverified',
              'under **25,000 characters**',
              'Do not invent findings',
              'Every material claim maps to the PoC/evidence section',
              'App version/build',
              'Device / emulator profile',
              'Mobile scanner/static-analysis output was not promoted',
          ]
          for phrase in required_phrases:
              assert phrase in template, f'missing report integrity requirement: {phrase}'

          for phrase in [
              'canonical report structure',
              'Every material claim must have a concrete proof reference',
              'The complete content under `# Description`',
              'Severity and VRT classification must be based on the behavior actually demonstrated',
              'Minly Android App',
              'Minly iOS App',
              'manual PoC remains the proof of vulnerability',
          ]:
              assert phrase in rules, f'missing compilation rule: {phrase}'

          print('Minly VDP final-report schema validation PASS')
          PY

      - name: Reject unsafe blueprint patterns
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number -E '([*][.]minly[.]com|mass scan|brute[- ]force wordlist|DDoS payload)' programs/minly-vdp
          echo 'unsafe-pattern gate: PASS'

      - name: Build sanitized participation bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/minly-vdp-blueprint
          cp programs/minly-vdp/*.md programs/minly-vdp/scope.yml artifacts/minly-vdp-blueprint/
          printf '%s\n' \
            'Minly VDP participation blueprint' \
            'Contains generic scope, methodology, mobile toolchain, evidence, and submission templates only.' \
            'The canonical final report format is SUBMISSION_TEMPLATE.md and FINAL_REPORT_FORMAT.md.' \
            'No live vulnerability details, mobile binaries, or secrets are permitted in this repository.' \
            > artifacts/minly-vdp-blueprint/MANIFEST.txt

      - name: Upload blueprint artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minly-vdp-blueprint-${{ github.run_id }}
          path: artifacts/minly-vdp-blueprint/
          if-no-files-found: error
          retention-days: 30
