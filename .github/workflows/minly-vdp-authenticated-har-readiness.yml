name: Minly Authenticated HAR Readiness

on:
  push:
    branches:
      - 'feat/minly-*'
      - 'program/minly-*'
      - main
    paths:
      - 'programs/minly-vdp/har_candidate_map.py'
      - 'programs/minly-vdp/AUTHENTICATED_CAPTURE_WORKAROUND.md'
      - '.github/workflows/minly-vdp-authenticated-har-audit.yml'
      - '.github/workflows/minly-vdp-authenticated-har-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile mapper
        run: python -m py_compile programs/minly-vdp/har_candidate_map.py
      - name: Synthetic HAR privacy and candidate test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/minly-har-test
          mkdir -p /tmp/minly-har-test
          cat > /tmp/minly-har-test/input.har <<'JSON'
          {
            "log": {
              "version": "1.2",
              "creator": {"name":"synthetic","version":"1"},
              "entries": [
                {
                  "request": {
                    "method":"GET",
                    "url":"https://minly.com/api/profile?user_id=SECRET-USER-ID",
                    "headers":[{"name":"Authorization","value":"Bearer DO-NOT-PERSIST"},{"name":"Cookie","value":"session=DO-NOT-PERSIST"}],
                    "queryString":[{"name":"user_id","value":"SECRET-USER-ID"}]
                  },
                  "response": {
                    "status":200,
                    "headers":[{"name":"Set-Cookie","value":"session=DO-NOT-PERSIST"}],
                    "content":{"mimeType":"application/json","text":"{\"id\":\"SECRET-USER-ID\",\"display_name\":\"Researcher\"}"}
                  }
                },
                {
                  "request":{"method":"POST","url":"https://minly.com/api/booking/123456/payment","headers":[]},
                  "response":{"status":201,"headers":[],"content":{"mimeType":"application/json","text":"{\"booking_id\":123456,\"status\":\"ok\"}"}}
                },
                {
                  "request":{"method":"GET","url":"https://cdn.example.invalid/app.js?token=THIRD-PARTY-SECRET","headers":[]},
                  "response":{"status":200,"headers":[],"content":{"mimeType":"application/javascript","text":"alert(1)"}}
                }
              ]
            }
          }
          JSON
          python programs/minly-vdp/har_candidate_map.py \
            --har /tmp/minly-har-test/input.har \
            --output /tmp/minly-har-test/out \
            --temp-js-dir /tmp/minly-har-test/js
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/minly-har-test/out/har-surface-map.json')
          data=json.loads(p.read_text())
          assert data['counts']['har_entries'] == 3
          assert data['counts']['exact_host_entries'] == 2
          assert data['counts']['third_party_entries_ignored'] == 1
          assert data['counts']['unverified_candidates'] >= 2
          assert all(c['verification_status'] == 'Unverified' for c in data['manual_verification_queue'])
          text=p.read_text()
          for forbidden in ['SECRET-USER-ID','DO-NOT-PERSIST','THIRD-PARTY-SECRET','Researcher']:
              assert forbidden not in text, forbidden
          assert not Path('/tmp/minly-har-test/js').exists() or not any(Path('/tmp/minly-har-test/js').glob('*.js'))
          print('synthetic HAR exact-scope + privacy gate: PASS')
          PY
