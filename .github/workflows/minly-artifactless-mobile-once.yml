name: One-shot Minly Artifactless Mobile Fallback

on:
  push:
    branches:
      - feat/minly-artifactless-mobile-workaround

permissions:
  contents: read

concurrency:
  group: minly-artifactless-mobile-once
  cancel-in-progress: false

jobs:
  mobile-fallback:
    name: Android public-artifact + iOS metadata fallback
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Android static-analysis toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool unzip file binutils default-jre-headless
          python -m pip install -U pip
          python -m pip install 'PyYAML==6.0.3' 'androguard<5' 'mobsfscan<1' 'semgrep<2' 'detect-secrets<2' 'lief<1'
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
            echo "$bt" >> "$GITHUB_PATH"
            export PATH="$bt:$PATH"
          fi
          command -v aapt
          command -v apksigner
          python -m py_compile programs/minly-vdp/public_mobile_fallback.py programs/minly-vdp/mobile_static_audit.py

      - name: Acquire and provenance-check public Minly Android artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/minly-fallback/android
          python programs/minly-vdp/public_mobile_fallback.py android \
            --workdir "${RUNNER_TEMP}/minly-public-android" \
            --output artifacts/minly-fallback/android/public-provenance.json

      - name: Run Android static families on provenance-checked base APK
        shell: bash
        run: |
          set -euo pipefail
          apk="${RUNNER_TEMP}/minly-public-android/com.minly.users.apk"
          test -s "$apk"
          python programs/minly-vdp/mobile_static_audit.py \
            --platform android \
            --artifact "$apk" \
            --output artifacts/minly-fallback/android \
            --expected-package com.minly.users
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('artifacts/minly-fallback/android')
          summary=json.loads((out/'summary.json').read_text())
          provenance=json.loads((out/'public-provenance.json').read_text())
          summary['status']='RAN_PUBLIC_MIRROR_STATIC'
          summary['artifact_provenance']=provenance
          summary['provenance_limitation']='Public mirror artifact; package and signing certificate verified before static analysis. Not claimed byte-identical to current Google Play delivery.'
          (out/'summary.json').write_text(json.dumps(summary,indent=2,default=str))
          PY

      - name: Run iOS public metadata and associated-domain fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/minly-fallback/ios
          python programs/minly-vdp/public_mobile_fallback.py ios \
            --output artifacts/minly-fallback/ios/summary.json

      - name: Candidate and provenance integrity gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/minly-fallback/android/summary.json').read_text())
          i=json.loads(Path('artifacts/minly-fallback/ios/summary.json').read_text())
          assert a['observed_package'] == 'com.minly.users'
          assert a['status'] == 'RAN_PUBLIC_MIRROR_STATIC'
          assert a['artifact_provenance']['base_apk']['known_cert_sha1_match'] is True
          assert a['verification_status'] == 'UNVERIFIED_STATIC_CANDIDATES_ONLY'
          assert i['app_store_id'] == '1528802350'
          assert i['binary_static_coverage'] is False
          assert i['status'] == 'RAN_PUBLIC_METADATA_ONLY'
          assert i['verification_status'] == 'UNVERIFIED_METADATA_CANDIDATES_ONLY'
          print('artifactless mobile fallback integrity: PASS')
          print('android candidate markers:', len(a.get('candidate_markers', [])))
          print('ios candidate markers:', len(i.get('candidate_markers', [])))
          PY

      - name: Remove downloaded and decoded proprietary material
        if: always()
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/minly-public-android"
          rm -rf artifacts/minly-fallback/android/decoded artifacts/minly-fallback/android/jadx
          rm -f artifacts/minly-fallback/android/mobsfscan.json artifacts/minly-fallback/android/semgrep.json artifacts/minly-fallback/android/detect-secrets.json

      - name: Upload sanitized mobile fallback evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minly-artifactless-mobile-${{ github.run_id }}
          path: artifacts/minly-fallback/
          if-no-files-found: error
          retention-days: 30
