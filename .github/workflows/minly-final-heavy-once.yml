name: One-shot Minly VDP Final Heavy Audit

on:
  push:
    branches:
      - run/minly-final-heavy-20260914

permissions:
  contents: read

concurrency:
  group: minly-vdp-final-heavy-once
  cancel-in-progress: false

jobs:
  preflight:
    name: Exact-scope zero-traffic preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate scope and final runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'PyYAML==6.0.3'
          python -m py_compile \
            programs/minly-vdp/final_audit_runner.py \
            programs/minly-vdp/final_report_maker.py \
            programs/minly-vdp/mobile_static_audit.py \
            programs/minly-vdp/minly_passive_map.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          root=Path('programs/minly-vdp')
          scope=yaml.safe_load((root/'scope.yml').read_text())
          assert scope['in_scope']['website'][0]['exact_hosts'] == ['minly.com']
          assert scope['in_scope']['android'][0]['package'] == 'com.minly.users'
          assert scope['in_scope']['ios'][0]['app_store_id'] == '1528802350'
          assert scope['account_policy']['own_accounts_only'] is True
          assert scope['account_policy']['access_other_user_data'] == 'forbidden'
          target=yaml.safe_load((root/'halo-targets.yml').read_text())['targets'][0]
          assert target['url'] == 'https://minly.com/'
          assert target['allow_hosts'] == ['minly.com']
          assert '*.minly.com' in target['deny_hosts']
          assert target['limits']['max_requests_per_second'] <= 1
          print('exact-scope final heavy audit preflight: PASS')
          PY

  web:
    name: Website exact-scope heavy audit
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MINLY_USER_STORAGE_STATE_B64: ${{ secrets.MINLY_USER_STORAGE_STATE_B64 }}
      HALO_MINLY_USER_AUTH_CHECK_URL: ${{ secrets.MINLY_USER_AUTH_CHECK_URL }}
      HALO_MINLY_USER_AUTH_CHECK_CONTAINS: ${{ secrets.MINLY_USER_AUTH_CHECK_CONTAINS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install website audit toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -e '.[all]'
          python -m pip install 'PyYAML==6.0.3' 'semgrep<2' 'detect-secrets<2'
          python -m playwright install --with-deps chromium
          semgrep --validate --config programs/minly-vdp/semgrep/minly-client.yml
      - name: Materialize optional researcher session
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MINLY_USER_STORAGE_STATE_B64:-}" ]; then
            mkdir -p "${RUNNER_TEMP}/minly-auth"
            chmod 700 "${RUNNER_TEMP}/minly-auth"
            path="${RUNNER_TEMP}/minly-auth/storage-state.json"
            printf '%s' "$MINLY_USER_STORAGE_STATE_B64" | base64 --decode > "$path"
            chmod 600 "$path"
            python -m json.tool "$path" >/dev/null
            echo "HALO_MINLY_USER_STORAGE_STATE=$path" >> "$GITHUB_ENV"
            echo 'website identity mode: authenticated researcher session available'
          else
            echo 'website identity mode: anonymous/public-only; no storage-state secret configured'
          fi
      - name: Run website final audit families
        shell: bash
        run: |
          set -euo pipefail
          python programs/minly-vdp/final_audit_runner.py \
            --phase web \
            --output artifacts/minly-final \
            --max-pages 20 \
            --request-budget 120 \
            --delay-ms 1200
      - name: Sanitize website evidence
        shell: bash
        run: |
          set -euo pipefail
          test ! -e artifacts/minly-final/web/passive/_temp_js
          test ! -e artifacts/minly-final/web/passive/semgrep-raw.json
          test ! -e artifacts/minly-final/web/passive/detect-secrets-raw.json
          python - <<'PY'
          from pathlib import Path
          forbidden=['authorization:', 'set-cookie:', 'bearer ', 'cookie:']
          for p in Path('artifacts/minly-final/web').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.json','.md','.txt','.html'}:
                  continue
              t=p.read_text(errors='ignore').lower()
              bad=[x for x in forbidden if x in t]
              if bad:
                  raise SystemExit(f'possible secret/header material remained in {p}: {bad}')
          print('website evidence sanitation: PASS')
          PY
      - name: Remove ephemeral session material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/minly-auth"
      - name: Upload website evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minly-once-web-${{ github.run_id }}
          path: artifacts/minly-final/web/
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android official-app offline families
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MOBILE_ARTIFACT_URL: ${{ secrets.MINLY_ANDROID_APK_URL }}
      MOBILE_ARTIFACT_SHA256: ${{ secrets.MINLY_ANDROID_APK_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Determine Android artifact availability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/minly-final/android
          if [ -n "${MOBILE_ARTIFACT_URL:-}" ] && [ -n "${MOBILE_ARTIFACT_SHA256:-}" ]; then
            echo 'HAS_ANDROID=true' >> "$GITHUB_ENV"
          else
            echo 'HAS_ANDROID=false' >> "$GITHUB_ENV"
            python - <<'PY'
          import json
          from pathlib import Path
          Path('artifacts/minly-final/android/summary.json').write_text(json.dumps({
            'platform':'android','status':'SKIPPED',
            'reason':'MINLY_ANDROID_APK_URL and/or MINLY_ANDROID_APK_SHA256 secret not configured',
            'target_package':'com.minly.users','candidate_markers':[], 'toolchain':{}
          }, indent=2))
          PY
          fi
      - name: Install Android toolchain
        if: ${{ env.HAS_ANDROID == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool unzip file binutils
          python -m pip install -U pip
          python -m pip install 'PyYAML==6.0.3' 'androguard<5' 'mobsfscan<1' 'semgrep<2' 'detect-secrets<2' 'lief<1'
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
            echo "$bt" >> "$GITHUB_PATH"
          fi
      - name: Download and verify APK
        if: ${{ env.HAS_ANDROID == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/minly-android"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.parse, urllib.request
          url=os.environ['MOBILE_ARTIFACT_URL']; expected=os.environ['MOBILE_ARTIFACT_SHA256'].strip().lower()
          p=urllib.parse.urlsplit(url)
          if p.scheme!='https' or p.username or p.password: raise SystemExit('APK URL must be HTTPS without embedded credentials')
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'minly-android'/'app.apk'
          req=urllib.request.Request(url, headers={'User-Agent':'Minly-VDP-final-offline-audit/1.0'})
          with urllib.request.urlopen(req, timeout=120) as r, dest.open('wb') as f:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  f.write(chunk)
                  if f.tell()>600*1024*1024: raise SystemExit('APK exceeds 600 MiB safety limit')
          actual=hashlib.sha256(dest.read_bytes()).hexdigest()
          if actual!=expected: dest.unlink(missing_ok=True); raise SystemExit(f'APK SHA mismatch: {actual}')
          print('APK SHA-256 verification: PASS')
          PY
      - name: Run Android families
        if: ${{ env.HAS_ANDROID == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python programs/minly-vdp/final_audit_runner.py \
            --phase android \
            --artifact "${RUNNER_TEMP}/minly-android/app.apk" \
            --output artifacts/minly-final
          python programs/minly-vdp/mobile_artifact_inspect.py \
            --platform android \
            --artifact "${RUNNER_TEMP}/minly-android/app.apk" \
            --output artifacts/minly-final/android/artifact-inspection.json
      - name: Remove Android proprietary material
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/minly-android"
          rm -rf artifacts/minly-final/android/decoded artifacts/minly-final/android/jadx
      - name: Upload Android evidence/status
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minly-once-android-${{ github.run_id }}
          path: artifacts/minly-final/android/
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS official-app offline families
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 90
    env:
      MOBILE_ARTIFACT_URL: ${{ secrets.MINLY_IOS_IPA_URL }}
      MOBILE_ARTIFACT_SHA256: ${{ secrets.MINLY_IOS_IPA_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Determine iOS artifact availability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/minly-final/ios
          if [ -n "${MOBILE_ARTIFACT_URL:-}" ] && [ -n "${MOBILE_ARTIFACT_SHA256:-}" ]; then
            echo 'HAS_IOS=true' >> "$GITHUB_ENV"
          else
            echo 'HAS_IOS=false' >> "$GITHUB_ENV"
            python - <<'PY'
          import json
          from pathlib import Path
          Path('artifacts/minly-final/ios/summary.json').write_text(json.dumps({
            'platform':'ios','status':'SKIPPED',
            'reason':'MINLY_IOS_IPA_URL and/or MINLY_IOS_IPA_SHA256 secret not configured',
            'target_app_store_id':'1528802350','candidate_markers':[], 'toolchain':{}
          }, indent=2))
          PY
          fi
      - name: Install iOS toolchain
        if: ${{ env.HAS_IOS == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install 'PyYAML==6.0.3' 'semgrep<2' 'detect-secrets<2' 'lief<1'
          xcrun --find otool
          xcrun --find nm
          command -v codesign
          command -v strings
      - name: Download and verify IPA
        if: ${{ env.HAS_IOS == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/minly-ios"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.parse, urllib.request
          url=os.environ['MOBILE_ARTIFACT_URL']; expected=os.environ['MOBILE_ARTIFACT_SHA256'].strip().lower()
          p=urllib.parse.urlsplit(url)
          if p.scheme!='https' or p.username or p.password: raise SystemExit('IPA URL must be HTTPS without embedded credentials')
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'minly-ios'/'app.ipa'
          req=urllib.request.Request(url, headers={'User-Agent':'Minly-VDP-final-offline-audit/1.0'})
          with urllib.request.urlopen(req, timeout=120) as r, dest.open('wb') as f:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  f.write(chunk)
                  if f.tell()>800*1024*1024: raise SystemExit('IPA exceeds 800 MiB safety limit')
          actual=hashlib.sha256(dest.read_bytes()).hexdigest()
          if actual!=expected: dest.unlink(missing_ok=True); raise SystemExit(f'IPA SHA mismatch: {actual}')
          print('IPA SHA-256 verification: PASS')
          PY
      - name: Run iOS families
        if: ${{ env.HAS_IOS == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python programs/minly-vdp/final_audit_runner.py \
            --phase ios \
            --artifact "${RUNNER_TEMP}/minly-ios/app.ipa" \
            --output artifacts/minly-final
          python programs/minly-vdp/mobile_artifact_inspect.py \
            --platform ios \
            --artifact "${RUNNER_TEMP}/minly-ios/app.ipa" \
            --output artifacts/minly-final/ios/artifact-inspection.json
      - name: Remove iOS proprietary material
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/minly-ios"
          rm -rf artifacts/minly-final/ios/extracted
          rm -f artifacts/minly-final/ios/binary-strings.txt
      - name: Upload iOS evidence/status
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minly-once-ios-${{ github.run_id }}
          path: artifacts/minly-final/ios/
          if-no-files-found: error
          retention-days: 30

  compile:
    name: Compile final human-reviewed report
    if: ${{ always() && needs.preflight.result == 'success' }}
    needs: [preflight, web, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MINLY_MANUAL_FINDINGS_B64: ${{ secrets.MINLY_MANUAL_FINDINGS_B64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download website evidence
        uses: actions/download-artifact@v4
        with:
          name: minly-once-web-${{ github.run_id }}
          path: artifacts/minly-final/web
      - name: Download Android evidence/status
        uses: actions/download-artifact@v4
        with:
          name: minly-once-android-${{ github.run_id }}
          path: artifacts/minly-final/android
      - name: Download iOS evidence/status
        uses: actions/download-artifact@v4
        with:
          name: minly-once-ios-${{ github.run_id }}
          path: artifacts/minly-final/ios
      - name: Materialize optional human-reviewed finding records
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MINLY_MANUAL_FINDINGS_B64:-}" ]; then
            path="${RUNNER_TEMP}/manual-findings.json"
            printf '%s' "$MINLY_MANUAL_FINDINGS_B64" | base64 --decode > "$path"
            python -m json.tool "$path" >/dev/null
            echo "MINLY_MANUAL_FINDINGS_PATH=$path" >> "$GITHUB_ENV"
          fi
      - name: Compile final report
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'PyYAML==6.0.3' 'weasyprint<70'
          args=(--phase compile --output artifacts/minly-final)
          if [ -n "${MINLY_MANUAL_FINDINGS_PATH:-}" ]; then args+=(--manual-findings "$MINLY_MANUAL_FINDINGS_PATH"); fi
          python programs/minly-vdp/final_audit_runner.py "${args[@]}"
          weasyprint \
            artifacts/minly-final/final-report/compiled-final-report.html \
            artifacts/minly-final/final-report/compiled-final-report.pdf
      - name: Final integrity gate
        shell: bash
        run: |
          set -euo pipefail
          for f in compiled-final-report.json compiled-final-report.md compiled-final-report.html compiled-final-report.pdf; do
            test -s "artifacts/minly-final/final-report/$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/minly-final/final-report/compiled-final-report.json').read_text())
          p=data['policy']
          assert p['do_not_invent_findings'] is True
          assert p['proof_required_for_claims'] is True
          assert p['automated_candidates_are_unverified'] is True
          for f in data['accepted_manual_findings']:
              assert f['status'] in {'Verified','Partially verified','Unverified'}
              assert f['impact_attacker'].lower().startswith('as an attacker, i could')
          print('final human-review report integrity: PASS')
          PY
      - name: Remove ephemeral manual finding source
        if: always()
        run: rm -f "${RUNNER_TEMP}/manual-findings.json"
      - name: Upload complete final heavy-audit bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minly-final-heavy-audit-${{ github.run_id }}
          path: artifacts/minly-final/
          if-no-files-found: error
          retention-days: 30
