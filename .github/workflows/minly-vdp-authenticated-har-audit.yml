name: Minly VDP Authenticated HAR Audit

on:
  workflow_dispatch:
    inputs:
      confirm_current_scope:
        description: I re-checked the Minly VDP and confirm minly.com remains authorized
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: minly-vdp-authenticated-har-audit
  cancel-in-progress: false

jobs:
  offline-authenticated-capture:
    name: Offline authenticated Minly capture analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MINLY_AUTHENTICATED_HAR_URL: ${{ secrets.MINLY_AUTHENTICATED_HAR_URL }}
      MINLY_AUTHENTICATED_HAR_SHA256: ${{ secrets.MINLY_AUTHENTICATED_HAR_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Confirm current scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_current_scope }}" != "true" ]; then
            echo 'Blocked: current Minly scope confirmation is required.'
            exit 2
          fi

      - name: Install offline candidate toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install 'semgrep<2' 'detect-secrets<2'
          python -m py_compile programs/minly-vdp/har_candidate_map.py
          semgrep --validate --config programs/minly-vdp/semgrep/minly-client.yml

      - name: Download and verify researcher-owned HAR
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MINLY_AUTHENTICATED_HAR_URL:-}" || { echo 'Missing MINLY_AUTHENTICATED_HAR_URL secret'; exit 2; }
          test -n "${MINLY_AUTHENTICATED_HAR_SHA256:-}" || { echo 'Missing MINLY_AUTHENTICATED_HAR_SHA256 secret'; exit 2; }
          mkdir -p "${RUNNER_TEMP}/minly-har"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.parse, urllib.request
          url=os.environ['MINLY_AUTHENTICATED_HAR_URL']
          expected=os.environ['MINLY_AUTHENTICATED_HAR_SHA256'].strip().lower()
          p=urllib.parse.urlsplit(url)
          if p.scheme != 'https' or p.username or p.password:
              raise SystemExit('HAR URL must be HTTPS without embedded credentials')
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'minly-har'/'session.har'
          req=urllib.request.Request(url, headers={'User-Agent':'Minly-VDP-offline-HAR-audit/1.0'})
          with urllib.request.urlopen(req, timeout=120) as r, dest.open('wb') as f:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  f.write(chunk)
                  if f.tell() > 100*1024*1024:
                      raise SystemExit('HAR exceeds 100 MiB safety limit')
          actual=hashlib.sha256(dest.read_bytes()).hexdigest()
          if actual != expected:
              dest.unlink(missing_ok=True)
              raise SystemExit(f'HAR SHA mismatch: {actual}')
          print('HAR SHA-256 verification: PASS')
          PY

      - name: Map exact-host authenticated surface offline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/minly-har
          python programs/minly-vdp/har_candidate_map.py \
            --har "${RUNNER_TEMP}/minly-har/session.har" \
            --output artifacts/minly-har \
            --temp-js-dir "${RUNNER_TEMP}/minly-har/js"

      - name: Analyze captured same-origin JavaScript offline
        shell: bash
        run: |
          set -euo pipefail
          js="${RUNNER_TEMP}/minly-har/js"
          if [ -d "$js" ] && find "$js" -type f -name '*.js' -print -quit | grep -q .; then
            semgrep scan --config programs/minly-vdp/semgrep/minly-client.yml --json --output "${RUNNER_TEMP}/semgrep.json" "$js" || true
            detect-secrets scan --all-files "$js" > "${RUNNER_TEMP}/detect-secrets.json" || true
            python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path('artifacts/minly-har')
          raw=json.loads((Path(os.environ['RUNNER_TEMP'])/'semgrep.json').read_text()) if (Path(os.environ['RUNNER_TEMP'])/'semgrep.json').exists() else {'results':[]}
          cleaned=[]
          for r in raw.get('results',[]):
              cleaned.append({
                  'check_id':r.get('check_id'),
                  'file':Path(r.get('path','')).name,
                  'line':(r.get('start') or {}).get('line'),
                  'message':((r.get('extra') or {}).get('message') or '')[:240],
                  'verification_status':'Unverified',
                  'manual_validation_required':True,
              })
          (out/'har-js-semgrep-candidates.json').write_text(json.dumps({'candidate_count':len(cleaned),'results':cleaned},indent=2))
          ds_path=Path(os.environ['RUNNER_TEMP'])/'detect-secrets.json'
          ds=json.loads(ds_path.read_text()) if ds_path.exists() and ds_path.read_text().strip() else {'results':{}}
          secret=[]
          for filename,items in (ds.get('results') or {}).items():
              for item in items:
                  secret.append({
                      'file':Path(filename).name,
                      'line_number':item.get('line_number'),
                      'type':item.get('type'),
                      'hashed_secret':item.get('hashed_secret'),
                      'verification_status':'Unverified',
                      'manual_validation_required':True,
                  })
          (out/'har-js-secret-pattern-candidates.json').write_text(json.dumps({'candidate_count':len(secret),'results':secret},indent=2))
          PY
          else
            printf '%s\n' '{"candidate_count":0,"results":[]}' > artifacts/minly-har/har-js-semgrep-candidates.json
            printf '%s\n' '{"candidate_count":0,"results":[]}' > artifacts/minly-har/har-js-secret-pattern-candidates.json
          fi

      - name: Privacy and scope integrity gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/minly-har/har-surface-map.json')
          data=json.loads(p.read_text())
          assert data['scope']['exact_host'] == 'minly.com'
          assert data['live_target_traffic_generated'] is False
          privacy=data['privacy']
          assert privacy['request_response_bodies_persisted'] is False
          assert privacy['header_values_persisted'] is False
          assert privacy['cookie_values_persisted'] is False
          assert privacy['authorization_values_persisted'] is False
          assert privacy['query_values_persisted'] is False
          text=p.read_text().lower()
          for forbidden in ['authorization: bearer ', 'set-cookie:', 'cookie:']:
              assert forbidden not in text
          print('HAR privacy + exact-scope gate: PASS')
          PY
          rm -rf "${RUNNER_TEMP}/minly-har" "${RUNNER_TEMP}/semgrep.json" "${RUNNER_TEMP}/detect-secrets.json"

      - name: Upload sanitized authenticated-capture candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minly-authenticated-har-${{ github.run_id }}
          path: artifacts/minly-har/
          if-no-files-found: error
          retention-days: 30
