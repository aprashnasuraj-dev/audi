name: Minly VDP Mobile Artifact Audit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: In-scope Minly mobile target
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
      confirm_current_scope:
        description: I re-checked the Minly VDP and confirm the selected official app is currently in scope
        required: true
        default: false
        type: boolean
      run_artifact_audit:
        description: Run analysis using the configured private artifact URL/SHA secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: minly-vdp-mobile-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  android:
    if: ${{ inputs.platform == 'android' }}
    name: Android APK offline audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOBILE_ARTIFACT_URL: ${{ secrets.MINLY_ANDROID_APK_URL }}
      MOBILE_ARTIFACT_SHA256: ${{ secrets.MINLY_ANDROID_APK_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-java@7a445ee88d4e23b52c33a2039a230077c4367a0b # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android analysis toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool binutils file jq unzip
          python -m pip install -U pip
          python -m pip install 'PyYAML==6.0.3' 'androguard<5' 'semgrep<2' 'detect-secrets<2' 'lief<1'
          bash scripts/install-trivy.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Verify exact Android scope and code
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile programs/minly-vdp/mobile_artifact_inspect.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          scope = yaml.safe_load(Path('programs/minly-vdp/scope.yml').read_text())
          target = scope['in_scope']['android'][0]
          assert target['package'] == 'com.minly.users'
          assert scope['account_policy']['own_accounts_only'] is True
          assert scope['account_policy']['access_other_user_data'] == 'forbidden'
          print('Android scope gate: PASS — com.minly.users')
          PY
          if [ "${{ inputs.confirm_current_scope }}" != "true" ]; then
            echo 'Blocked: current Minly scope confirmation is required.'
            exit 2
          fi

      - name: Record Android toolchain readiness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/minly-mobile
          {
            echo 'platform=android'
            echo "python=$(python --version 2>&1)"
            echo "java=$(java -version 2>&1 | head -1)"
            echo "apktool=$(apktool --version 2>&1 | head -1)"
            echo "androguard=$(androguard --version 2>&1 | head -1 || true)"
            echo "semgrep=$(semgrep --version 2>&1 | head -1)"
            echo "detect-secrets=$(detect-secrets --version 2>&1 | head -1)"
            echo "trivy=$(${HOME}/.local/bin/trivy --version 2>&1 | head -1)"
          } > artifacts/minly-mobile/TOOLCHAIN.txt

      - name: Require private APK input when artifact audit is enabled
        if: ${{ inputs.run_artifact_audit }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MOBILE_ARTIFACT_URL:-}" || { echo 'Missing secret MINLY_ANDROID_APK_URL'; exit 2; }
          test -n "${MOBILE_ARTIFACT_SHA256:-}" || { echo 'Missing secret MINLY_ANDROID_APK_SHA256'; exit 2; }

      - name: Download and verify APK
        if: ${{ inputs.run_artifact_audit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/minly-mobile"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.parse, urllib.request
          url = os.environ['MOBILE_ARTIFACT_URL']
          expected = os.environ['MOBILE_ARTIFACT_SHA256'].strip().lower()
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != 'https' or parsed.username or parsed.password:
              raise SystemExit('artifact URL must be HTTPS and must not embed credentials')
          dest = pathlib.Path(os.environ['RUNNER_TEMP'])/'minly-mobile'/'app.apk'
          req = urllib.request.Request(url, headers={'User-Agent':'Minly-VDP-offline-artifact-fetch/1.0'})
          with urllib.request.urlopen(req, timeout=120) as r, dest.open('wb') as f:
              while True:
                  chunk = r.read(1024 * 1024)
                  if not chunk: break
                  f.write(chunk)
                  if f.tell() > 600 * 1024 * 1024:
                      raise SystemExit('artifact exceeds 600 MiB safety limit')
          actual = hashlib.sha256(dest.read_bytes()).hexdigest()
          if actual != expected:
              dest.unlink(missing_ok=True)
              raise SystemExit(f'SHA-256 mismatch: expected {expected}, got {actual}')
          print('APK SHA-256 verification: PASS')
          PY

      - name: Run Android artifact inspection
        if: ${{ inputs.run_artifact_audit }}
        shell: bash
        run: |
          set -euo pipefail
          apk="${RUNNER_TEMP}/minly-mobile/app.apk"
          work="${RUNNER_TEMP}/minly-mobile/work"
          mkdir -p "$work"
          file "$apk" > artifacts/minly-mobile/artifact-type.txt
          python programs/minly-vdp/mobile_artifact_inspect.py \
            --platform android --artifact "$apk" \
            --output artifacts/minly-mobile/mobile-analysis.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/minly-mobile/mobile-analysis.json').read_text())
          package=data['identity'].get('package')
          if package != 'com.minly.users':
              raise SystemExit(f'APK package mismatch: {package!r}')
          print('APK identity verification: PASS')
          PY
          apktool d -f "$apk" -o "$work/apktool" >/dev/null
          unzip -qq "$apk" -d "$work/raw"

      - name: Run offline Android analyzers
        if: ${{ inputs.run_artifact_audit }}
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/minly-mobile/work"
          mkdir -p "$work/tool-output"
          semgrep scan --config auto --json --output "$work/tool-output/semgrep.json" "$work/apktool" || true
          detect-secrets scan --all-files "$work/apktool" > "$work/tool-output/detect-secrets.json" || true
          "${HOME}/.local/bin/trivy" fs --scanners vuln,misconfig --format json --output "$work/tool-output/trivy.json" "$work/raw" || true
          find "$work/raw/lib" -type f -name '*.so' -print 2>/dev/null | sort > "$work/tool-output/native-libs.txt" || true
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'minly-mobile'/'work'/'tool-output'
          out=Path('artifacts/minly-mobile')
          def load(name, default):
              p=root/name
              try: return json.loads(p.read_text())
              except Exception: return default
          sem=load('semgrep.json', {'results':[]})
          sem_clean=[{
              'rule':r.get('check_id'), 'file':Path(r.get('path','')).name,
              'line':(r.get('start') or {}).get('line'),
              'message':((r.get('extra') or {}).get('message') or '')[:240],
              'verification_status':'Unverified', 'candidate_only':True,
              'manual_validation_required':True,
          } for r in sem.get('results',[])][:1000]
          (out/'semgrep-candidates.json').write_text(json.dumps({'count':len(sem_clean),'results':sem_clean},indent=2))
          ds=load('detect-secrets.json', {'results':{}})
          ds_clean=[]
          for fn, findings in (ds.get('results') or {}).items():
              for f in findings:
                  ds_clean.append({'file':Path(fn).name,'line':f.get('line_number'),'type':f.get('type'),'hashed_secret':f.get('hashed_secret'),'verification_status':'Unverified','candidate_only':True})
          (out/'secret-pattern-candidates.json').write_text(json.dumps({'count':len(ds_clean),'results':ds_clean[:1000]},indent=2))
          tr=load('trivy.json', {'Results':[]})
          vulns=[]
          for result in tr.get('Results') or []:
              for v in result.get('Vulnerabilities') or []:
                  vulns.append({'id':v.get('VulnerabilityID'),'pkg':v.get('PkgName'),'installed':v.get('InstalledVersion'),'severity':v.get('Severity'),'reportability':'dependency_context_only_unless_direct_Minly_exploit_is_demonstrated'})
          (out/'dependency-context.json').write_text(json.dumps({'count':len(vulns),'results':vulns[:1000]},indent=2))
          libs=(root/'native-libs.txt').read_text(errors='ignore').splitlines() if (root/'native-libs.txt').exists() else []
          (out/'native-library-inventory.json').write_text(json.dumps({'count':len(libs),'libraries':[Path(x).name for x in libs]},indent=2))
          PY

      - name: Build Android manual-verification brief
        if: ${{ inputs.run_artifact_audit }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/minly-mobile')
          data=json.loads((root/'mobile-analysis.json').read_text())
          lines=['# Minly Android manual verification brief','',
                 '> Automated APK output is hypothesis/evidence only. Nothing below is a confirmed vulnerability until manually reproduced with concrete impact.','',
                 f"- Package: `{data['identity'].get('package')}`",
                 f"- Version: `{data['identity'].get('version_name')}`",
                 f"- Build/version code: `{data['identity'].get('version_code')}`",'',
                 '## Candidate queue','']
          for c in data.get('candidates',[]):
              lines.append(f"- **{c['priority']}** `{c['type']}` — `{c['location']}` — **Unverified**")
          lines += ['', '## Manual priorities','',
                    '1. Deep links/app links: verify auth, ownership, and sensitive-action confirmation.',
                    '2. Externally reachable components: verify only whether a normal app can cross a Minly security boundary.',
                    '3. Backend/API authorization: use researcher-controlled Account A / Account B only; never enumerate unrelated identifiers.',
                    '4. WebView/native bridges and state transitions: keep proof minimal, reversible, and own-account only.',
                    '5. Do not submit best-practice-only, dependency-only, pinning-only, obfuscation-only, or rooted-device-only observations.']
          (root/'MANUAL_VERIFICATION_BRIEF.md').write_text('\n'.join(lines)+'\n')
          PY

      - name: Remove APK and decoded proprietary content
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/minly-mobile"

      - name: Upload sanitized Android research bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minly-android-audit-${{ github.run_id }}
          path: artifacts/minly-mobile/
          if-no-files-found: error
          retention-days: 30

  ios:
    if: ${{ inputs.platform == 'ios' }}
    name: iOS IPA offline audit
    runs-on: macos-14
    timeout-minutes: 60
    env:
      MOBILE_ARTIFACT_URL: ${{ secrets.MINLY_IOS_IPA_URL }}
      MOBILE_ARTIFACT_SHA256: ${{ secrets.MINLY_IOS_IPA_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install iOS analysis toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install 'PyYAML==6.0.3' 'semgrep<2' 'detect-secrets<2' 'lief<1'

      - name: Verify exact iOS scope and code
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile programs/minly-vdp/mobile_artifact_inspect.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          scope=yaml.safe_load(Path('programs/minly-vdp/scope.yml').read_text())
          target=scope['in_scope']['ios'][0]
          assert target['app_store_id'] == '1528802350'
          assert scope['account_policy']['own_accounts_only'] is True
          assert scope['account_policy']['access_other_user_data'] == 'forbidden'
          print('iOS scope gate: PASS — App Store ID 1528802350')
          PY
          if [ "${{ inputs.confirm_current_scope }}" != "true" ]; then
            echo 'Blocked: current Minly scope confirmation is required.'
            exit 2
          fi

      - name: Record iOS toolchain readiness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/minly-mobile
          {
            echo 'platform=ios'
            echo "python=$(python --version 2>&1)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ' | sed 's/ $//')"
            echo "codesign=$(/usr/bin/codesign --version 2>&1 || true)"
            echo "otool=$(xcrun --find otool)"
            echo "nm=$(xcrun --find nm)"
            echo "semgrep=$(semgrep --version 2>&1 | head -1)"
            echo "detect-secrets=$(detect-secrets --version 2>&1 | head -1)"
          } > artifacts/minly-mobile/TOOLCHAIN.txt

      - name: Require private IPA input when artifact audit is enabled
        if: ${{ inputs.run_artifact_audit }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MOBILE_ARTIFACT_URL:-}" || { echo 'Missing secret MINLY_IOS_IPA_URL'; exit 2; }
          test -n "${MOBILE_ARTIFACT_SHA256:-}" || { echo 'Missing secret MINLY_IOS_IPA_SHA256'; exit 2; }

      - name: Download and verify IPA
        if: ${{ inputs.run_artifact_audit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/minly-mobile"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.parse, urllib.request
          url=os.environ['MOBILE_ARTIFACT_URL']
          expected=os.environ['MOBILE_ARTIFACT_SHA256'].strip().lower()
          parsed=urllib.parse.urlsplit(url)
          if parsed.scheme != 'https' or parsed.username or parsed.password:
              raise SystemExit('artifact URL must be HTTPS and must not embed credentials')
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'minly-mobile'/'app.ipa'
          req=urllib.request.Request(url,headers={'User-Agent':'Minly-VDP-offline-artifact-fetch/1.0'})
          with urllib.request.urlopen(req,timeout=120) as r,dest.open('wb') as f:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  f.write(chunk)
                  if f.tell()>1200*1024*1024:
                      raise SystemExit('artifact exceeds 1.2 GiB safety limit')
          actual=hashlib.sha256(dest.read_bytes()).hexdigest()
          if actual!=expected:
              dest.unlink(missing_ok=True)
              raise SystemExit(f'SHA-256 mismatch: expected {expected}, got {actual}')
          print('IPA SHA-256 verification: PASS')
          PY

      - name: Run iOS artifact inspection
        if: ${{ inputs.run_artifact_audit }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="${RUNNER_TEMP}/minly-mobile/app.ipa"
          work="${RUNNER_TEMP}/minly-mobile/work"
          mkdir -p "$work"
          file "$ipa" > artifacts/minly-mobile/artifact-type.txt
          python programs/minly-vdp/mobile_artifact_inspect.py \
            --platform ios --artifact "$ipa" \
            --output artifacts/minly-mobile/mobile-analysis.json
          unzip -qq "$ipa" -d "$work/ipa"
          app_dir=$(find "$work/ipa/Payload" -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$app_dir"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/minly-mobile/mobile-analysis.json').read_text())
          Path('artifacts/minly-mobile/target-identity.json').write_text(json.dumps(data['identity'],indent=2))
          PY
          exe_name=$(python -c "import json; print(json.load(open('artifacts/minly-mobile/mobile-analysis.json'))['identity']['executable'] or '')")
          if [ -n "$exe_name" ] && [ -f "$app_dir/$exe_name" ]; then
            /usr/bin/codesign -d --entitlements :- "$app_dir" > "$work/entitlements.plist" 2>/dev/null || true
            xcrun otool -L "$app_dir/$exe_name" > "$work/linked-libraries.txt" || true
            xcrun nm -u "$app_dir/$exe_name" > "$work/undefined-symbols.txt" 2>/dev/null || true
          fi

      - name: Run offline iOS analyzers and sanitize output
        if: ${{ inputs.run_artifact_audit }}
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/minly-mobile/work"
          mkdir -p "$work/tool-output"
          semgrep scan --config auto --json --output "$work/tool-output/semgrep.json" "$work/ipa/Payload" || true
          detect-secrets scan --all-files "$work/ipa/Payload" > "$work/tool-output/detect-secrets.json" || true
          python - <<'PY'
          import json, os, plistlib
          from pathlib import Path
          work=Path(os.environ['RUNNER_TEMP'])/'minly-mobile'/'work'
          out=Path('artifacts/minly-mobile')
          def load(name, default):
              p=work/'tool-output'/name
              try:return json.loads(p.read_text())
              except Exception:return default
          sem=load('semgrep.json',{'results':[]})
          clean=[{'rule':r.get('check_id'),'file':Path(r.get('path','')).name,'line':(r.get('start') or {}).get('line'),'message':((r.get('extra') or {}).get('message') or '')[:240],'verification_status':'Unverified','candidate_only':True,'manual_validation_required':True} for r in sem.get('results',[])][:1000]
          (out/'semgrep-candidates.json').write_text(json.dumps({'count':len(clean),'results':clean},indent=2))
          ds=load('detect-secrets.json',{'results':{}})
          ds_clean=[]
          for fn,findings in (ds.get('results') or {}).items():
              for f in findings:
                  ds_clean.append({'file':Path(fn).name,'line':f.get('line_number'),'type':f.get('type'),'hashed_secret':f.get('hashed_secret'),'verification_status':'Unverified','candidate_only':True})
          (out/'secret-pattern-candidates.json').write_text(json.dumps({'count':len(ds_clean),'results':ds_clean[:1000]},indent=2))
          ent={}
          p=work/'entitlements.plist'
          if p.exists() and p.stat().st_size:
              try: ent=plistlib.loads(p.read_bytes())
              except Exception: ent={}
          ent_clean={
              'get_task_allow':ent.get('get-task-allow'),
              'associated_domains':ent.get('com.apple.developer.associated-domains',[]) or [],
              'application_groups_count':len(ent.get('com.apple.security.application-groups',[]) or []),
              'keychain_access_groups_count':len(ent.get('keychain-access-groups',[]) or []),
              'aps_environment_present':'aps-environment' in ent,
          }
          (out/'entitlement-surface.json').write_text(json.dumps(ent_clean,indent=2))
          libs=[]
          lp=work/'linked-libraries.txt'
          if lp.exists():
              libs=[x.strip().split(' (compatibility',1)[0] for x in lp.read_text(errors='ignore').splitlines()[1:] if x.strip()]
          (out/'linked-library-inventory.json').write_text(json.dumps({'count':len(libs),'libraries':libs},indent=2))
          PY

      - name: Build iOS manual-verification brief
        if: ${{ inputs.run_artifact_audit }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/minly-mobile')
          data=json.loads((root/'mobile-analysis.json').read_text())
          lines=['# Minly iOS manual verification brief','',
                 '> Automated IPA output is hypothesis/evidence only. Nothing below is a confirmed vulnerability until manually reproduced with concrete impact.','',
                 f"- Bundle ID: `{data['identity'].get('bundle_id')}`",
                 f"- Version: `{data['identity'].get('version')}`",
                 f"- Build: `{data['identity'].get('build')}`",'',
                 '## Candidate queue','']
          for c in data.get('candidates',[]):
              lines.append(f"- **{c['priority']}** `{c['type']}` — `{c['location']}` — **Unverified**")
          lines += ['', '## Manual priorities','',
                    '1. URL schemes/universal links: verify auth, ownership, and sensitive-action confirmation on a researcher-controlled device.',
                    '2. Backend/API authorization: use researcher-controlled Account A / Account B only; never enumerate unrelated identifiers.',
                    '3. WebView/native trust boundaries and app extensions: prove an actual Minly security consequence before reporting.',
                    '4. Keep any HTTP evidence minimal and redact tokens, cookies, payment data, and unrelated personal data.',
                    '5. Do not submit ATS/pinning/library/jailbreak/obfuscation observations without a direct demonstrated Minly exploit.']
          (root/'MANUAL_VERIFICATION_BRIEF.md').write_text('\n'.join(lines)+'\n')
          PY

      - name: Remove IPA and extracted proprietary content
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/minly-mobile"

      - name: Upload sanitized iOS research bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minly-ios-audit-${{ github.run_id }}
          path: artifacts/minly-mobile/
          if-no-files-found: error
          retention-days: 30
