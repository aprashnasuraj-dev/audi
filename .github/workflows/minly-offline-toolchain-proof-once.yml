name: One-shot Minly Offline Toolchain Proof

on:
  push:
    branches:
      - feat/minly-adaptive-audit-v2

permissions:
  contents: read

concurrency:
  group: minly-offline-toolchain-proof-once
  cancel-in-progress: true

jobs:
  prove-offline-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install advanced analysis toolchain
        run: |
          python -m pip install -U pip
          python -m pip install \
            'semgrep==1.177.0' \
            'bandit==1.9.4' \
            'mitmproxy==12.2.2' \
            'pip-audit==2.10.1' \
            'PyYAML==6.0.3' \
            'httpx>=0.27,<1'
          bash scripts/install-trivy.sh
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Verify installed versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/minly-offline-proof
          semgrep --version | tee artifacts/minly-offline-proof/semgrep.txt
          bandit --version | tee artifacts/minly-offline-proof/bandit.txt
          mitmdump --version | head -n 1 | tee artifacts/minly-offline-proof/mitmproxy.txt
          pip-audit --version | tee artifacts/minly-offline-proof/pip-audit.txt
          "${HOME}/.local/bin/trivy" --version | head -n 1 | tee artifacts/minly-offline-proof/trivy.txt

      - name: Run Minly zero-network analysis gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/minly_policy_gate.py --json | tee artifacts/minly-offline-proof/policy-gate.json
          python scripts/minly_hypothesis_matrix.py --output artifacts/minly-offline-proof/hypotheses
          python scripts/minly_har_analyzer.py \
            tests/fixtures/minly_sample.har.json \
            --output artifacts/minly-offline-proof/har-analysis

      - name: Validate no-target-traffic proof outputs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/minly-offline-proof')
          hypotheses = json.loads((root/'hypotheses/hypothesis-matrix.json').read_text())
          har = json.loads((root/'har-analysis/operation-inventory.json').read_text())
          assert len(hypotheses) >= 15
          assert all(item['reportable_now'] is False for item in hypotheses)
          assert har['rules']['live_requests_sent_by_analyzer'] == 0
          assert har['rules']['credentials_exported'] is False
          print('Minly offline toolchain proof: PASS')
          PY

      - name: Upload offline toolchain proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minly-offline-toolchain-proof-${{ github.run_id }}
          path: artifacts/minly-offline-proof/
          if-no-files-found: error
          retention-days: 30
